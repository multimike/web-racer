<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Racer menu mockup: console</title>
<link rel="icon" href="data:,">
<!--
  STATIC MOCKUP (design-documents/menu-mockups/console.html), concept "console":
  gamepad-first menu system in the HUD's visual family.
    ?screen=title|car|setup|settings|controls|pause|confirm|post
    &prompts=pad|kb      button prompts follow the last input device
  The backdrops are real game frames WITH the race HUD baked in; the real
  title / car / setup screens hide the HUD, so this file blurs those spots
  (.patch) — mockup scaffolding, not part of the design.
  1rem = 1/94.1 of the height (the HUD's own unit), so every number below is
  a pixel of a 1672 x 941 frame divided by ten.
-->
<style>
:root {
  --slate: #141e27; --slate2: #1d2a36; --rim: #aebbc2; --cyan: #14e8f6; --yellow: #ffe14a; --red: #d42a3c;
  --ink: #06212b; --skew: -10deg;
  font-size: min(1.0627vh, 1.5625vw);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #6fb7e6; }
body {
  font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-weight: 800; font-style: italic; line-height: 1; color: #fff; white-space: nowrap;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none;
  text-shadow: -0.02em 0.03em 0 #8d98a0, 0.035em 0.055em 0 rgba(8,14,20,.6), 0 0.09em 0.22em rgba(8,14,20,.35);
}
/* ── backdrop: a 16:9 box that covers the window, so patches stay on their spots ── */
.bg { position: fixed; left: 50%; top: 50%; width: max(100vw, 177.78vh); height: max(100vh, 56.25vw); transform: translate(-50%,-50%); background: center / 100% 100% no-repeat; }
.patch { position: absolute; backdrop-filter: blur(3.4rem); -webkit-backdrop-filter: blur(3.4rem); -webkit-mask: radial-gradient(closest-side, #000 78%, transparent); mask: radial-gradient(closest-side, #000 78%, transparent); }
.scrim { position: fixed; inset: 0; }
body[data-dim="title"] .scrim { background:
  linear-gradient(90deg, rgba(10,18,26,.62) 0, rgba(10,18,26,.30) 34%, rgba(10,18,26,0) 58%),
  linear-gradient(0deg, rgba(10,18,26,.78) 0, rgba(10,18,26,0) 20%),
  linear-gradient(180deg, rgba(10,18,26,.45) 0, rgba(10,18,26,0) 18%); }
body[data-dim="sheet"] .scrim { background: rgba(12,22,32,.60); backdrop-filter: blur(1rem) saturate(.85); -webkit-backdrop-filter: blur(1rem) saturate(.85); }
body[data-dim="pause"] .scrim { background: rgba(12,22,32,.50); backdrop-filter: blur(.55rem) saturate(.7); -webkit-backdrop-filter: blur(.55rem) saturate(.7); }
body[data-dim="confirm"] .scrim { background: rgba(8,14,20,.72); backdrop-filter: blur(.8rem) saturate(.6); -webkit-backdrop-filter: blur(.8rem) saturate(.6); }
body[data-dim="post"] .scrim { background: linear-gradient(0deg, rgba(10,18,26,.8) 0, rgba(10,18,26,.38) 40%, rgba(10,18,26,.3) 100%); backdrop-filter: blur(.25rem); -webkit-backdrop-filter: blur(.25rem); }

.ui { position: fixed; inset: 0; }
.x { display: inline-block; transform: scaleX(1.08); transform-origin: left center; }
.xc { display: inline-block; transform: scaleX(1.08); }

/* ── the slanted slate plate of the HUD ── */
.pl { position: absolute; inset: 0; transform: skewX(var(--skew)); border-radius: 1.4rem; background: var(--slate); border: max(1px, .16rem) solid var(--rim); opacity: .73; }
.sheet > .pl { --skew: -3deg; border-radius: 2.2rem; opacity: .9; }
.rel { position: relative; }

/* ── menu rows: ONE focus look everywhere ── */
.row { position: relative; height: 6.6rem; display: flex; align-items: center; padding: 0 3rem 0 3.2rem; margin-top: 1.1rem; }
.row .lbl { position: relative; font-size: 3.3rem; font-weight: 900; letter-spacing: .03em; }
.row .sub { position: relative; font-size: 1.75rem; font-weight: 700; opacity: .8; letter-spacing: .05em; margin-top: .55rem; }
.row .val { position: relative; margin-left: auto; display: flex; align-items: center; gap: 1.3rem; font-size: 2.6rem; }
.row .val.dim { opacity: .8; font-size: 2.1rem; font-weight: 700; letter-spacing: .04em; }
.sheet .row > .pl { background: #2a3947; border-color: transparent; opacity: .55; border-radius: 1.2rem; }
.row.focus { transform: translateX(1.6rem); color: var(--ink); text-shadow: 0 .06em 0 rgba(255,255,255,.45); }
.row.focus > .pl { background: linear-gradient(180deg, #5ff3fb 0, var(--cyan) 55%, #0fcfdd 100%); border-color: #fff; opacity: 1;
  box-shadow: 0 0 0 .45rem rgba(20,232,246,.28), 0 .8rem 1.8rem rgba(4,12,18,.45); }
.sheet .row.focus { transform: none; }
.row.focus .sub, .row.focus .val.dim { opacity: .85; }
.row.big { height: 10.4rem; }
.row.big .lbl { font-size: 5.2rem; }
.row .col { position: relative; display: flex; flex-direction: column; }
.row.danger:not(.focus) .lbl { color: #ffb3ba; }
.chev { position: relative; margin-left: auto; width: 1.5rem; height: 2.4rem; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%, 30% 50%); opacity: .9; }
.row .val + .chev, .row .tag + .chev { margin-left: 1.6rem; }
.arr { width: 1.5rem; height: 2.2rem; background: currentColor; clip-path: polygon(100% 0, 0 50%, 100% 100%); opacity: .35; }
.arr.r { clip-path: polygon(0 0, 100% 50%, 0 100%); }
.focus .arr { opacity: 1; }
.vtxt { min-width: 13rem; text-align: center; font-weight: 900; }
.tag { position: relative; font-size: 1.5rem; letter-spacing: .08em; padding: .45rem .9rem .5rem; border-radius: .6rem; background: var(--yellow); color: #2a2300; text-shadow: none; font-weight: 900; margin-left: 2.4rem; }
.tag.line { background: none; color: var(--yellow); box-shadow: inset 0 0 0 .16rem var(--yellow); }
.tag.cy { background: none; color: var(--cyan); box-shadow: inset 0 0 0 .16rem var(--cyan); }
.focus .tag.line, .focus .tag.cy { color: var(--ink); box-shadow: inset 0 0 0 .16rem var(--ink); }
/* segmented choice + pips + level bar */
.seg { display: flex; gap: .5rem; }
.seg span { font-size: 2.1rem; padding: .75rem 1.5rem .8rem; border-radius: .8rem; background: rgba(255,255,255,.1); opacity: .7; }
.seg span.on { background: #fff; color: var(--ink); opacity: 1; text-shadow: none; font-weight: 900; }
.focus .seg span { background: rgba(6,33,43,.14); opacity: .85; }
.focus .seg span.on { background: var(--ink); color: #fff; opacity: 1; }
.pips { display: flex; gap: .6rem; align-items: center; }
.pips i { width: 2.5rem; height: 2.5rem; border-radius: .7rem; transform: skewX(-10deg); background: rgba(255,255,255,.16); }
.pips i.on { background: #fff; }
.focus .pips i { background: rgba(6,33,43,.2); } .focus .pips i.on { background: var(--ink); }
.lvl { display: flex; gap: .35rem; transform: skewX(-10deg); }
.lvl i { width: 1.5rem; height: 2.5rem; border-radius: .3rem; background: rgba(255,255,255,.16); }
.lvl i.on { background: var(--cyan); }
.focus .lvl i { background: rgba(6,33,43,.2); } .focus .lvl i.on { background: var(--ink); }

/* ── header: wordmark / screen tabs ── */
.word { position: absolute; left: 6rem; top: 5.4rem; }
.word h1 { margin: 0; font-size: 10.5rem; font-weight: 900; letter-spacing: -.01em; text-shadow: -0.02em 0.03em 0 #8d98a0, .05em .07em 0 rgba(8,14,20,.75), 0 .1em .3em rgba(8,14,20,.45); }
.word h1 b { color: var(--cyan); font-weight: 900; text-shadow: -0.02em 0.03em 0 #0b97a3, .05em .07em 0 rgba(8,14,20,.75), 0 .1em .3em rgba(8,14,20,.45); }
.word .tagl { display: flex; align-items: center; gap: 1.4rem; margin-top: 1.1rem; font-size: 2rem; letter-spacing: .34em; font-weight: 800; }
.check { width: 11rem; height: 1.6rem; transform: skewX(-10deg); border-radius: .25rem;
  background: conic-gradient(#fff 25%, #141e27 0 50%, #fff 0 75%, #141e27 0) 0 0 / 1.6rem 1.6rem; box-shadow: 0 0 0 .14rem rgba(20,30,39,.8); }
.tabs { position: absolute; left: 0; right: 0; top: 4.2rem; display: flex; justify-content: center; align-items: center; gap: 1rem; }
.tab { position: relative; height: 5.4rem; padding: 0 2.6rem; display: flex; align-items: center; font-size: 2.5rem; letter-spacing: .04em; }
.tab .pl { border-radius: 1.2rem; }
.tab > span { position: relative; opacity: .82; }
.tab.on > span { opacity: 1; color: var(--ink); text-shadow: 0 .06em 0 rgba(255,255,255,.45); font-weight: 900; }
.tab.on .pl { background: #fff; border-color: #fff; opacity: .96; }
.tab.on::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1.1rem; height: .5rem; border-radius: .3rem; background: var(--cyan); transform: skewX(-10deg); }
.tabs .g { margin: 0 .8rem; }

/* ── footer: help line + button prompts ── */
.foot { position: absolute; left: 6rem; right: 6rem; bottom: 3.6rem; height: 5rem; display: flex; align-items: center; gap: 3rem; }
.help { font-size: 2.1rem; font-weight: 700; letter-spacing: .03em; opacity: .95; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.prompts { margin-left: auto; display: flex; gap: 2.8rem; align-items: center; }
.pr { display: flex; align-items: center; gap: .9rem; font-size: 2.1rem; letter-spacing: .05em; }
.g { display: inline-flex; align-items: center; justify-content: center; flex: none; text-shadow: none; }
.g svg { width: 3.7rem; height: 3.7rem; display: block; filter: drop-shadow(0 .2rem .3rem rgba(4,10,16,.5)); }
.g.pill, .g.key { height: 3.3rem; min-width: 3.5rem; padding: 0 1rem; border-radius: 1rem 1rem .6rem .6rem; background: #0f171f; box-shadow: inset 0 0 0 .2rem #dfe7ec, 0 .2rem .4rem rgba(4,10,16,.5); font-size: 1.75rem; font-style: normal; font-weight: 900; letter-spacing: .04em; color: #fff; }
.g.pill.opt { border-radius: 1.7rem; font-size: 1.35rem; letter-spacing: .1em; }
.g.key { border-radius: .7rem; background: #eef3f6; color: #16212b; box-shadow: inset 0 -.35rem 0 #b9c5cd, 0 .2rem .4rem rgba(4,10,16,.5); padding-bottom: .3rem; }

/* ── title ── */
.menu { position: absolute; left: 5.4rem; top: 27.5rem; width: 52rem; }
.card { position: absolute; right: 6rem; top: 17rem; width: 45rem; padding: 2.6rem 3.2rem 2.8rem 3.6rem; }
.card > .pl { --skew: -4deg; border-radius: 2rem; opacity: .9; }
.card h3 { position: relative; margin: 0; font-size: 1.9rem; letter-spacing: .26em; color: var(--cyan); font-weight: 800; }
.card .name { position: relative; font-size: 3.7rem; font-weight: 900; margin-top: 1rem; }
.map { position: relative; margin: 1.6rem 0 1.2rem; height: 16rem; border-radius: 1.2rem; background: #0e161d; overflow: hidden; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.kv { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 2.15rem; padding: .95rem 0; border-top: max(1px,.12rem) solid rgba(174,187,194,.3); }
.kv b { font-weight: 700; opacity: .66; letter-spacing: .08em; font-size: .86em; }
.kv .sw { display: inline-block; width: 1.5rem; height: 1.5rem; border-radius: .4rem; margin-right: .8rem; vertical-align: -.1rem; transform: skewX(-10deg); box-shadow: 0 0 0 .14rem rgba(255,255,255,.7); }
.chip { position: absolute; right: 6rem; top: 5.2rem; height: 4.6rem; padding: 0 2.2rem; display: flex; align-items: center; gap: 1rem; font-size: 1.8rem; letter-spacing: .08em; }
.chip > * { position: relative; } .chip .pl { position: absolute; border-radius: 1.1rem; }
.dot { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: #55f08b; box-shadow: 0 0 .8rem #55f08b; }

/* ── sub-screens (car / setup / settings / controls) ── */
.stage { position: absolute; left: 6rem; right: 6rem; top: 14.5rem; bottom: 16.5rem; display: flex; gap: 3rem; justify-content: center; }
.sheet { position: relative; padding: 2.2rem 3.4rem 3rem 3.8rem; }
.sheet h2 { position: relative; margin: 0 0 .4rem; font-size: 1.9rem; letter-spacing: .26em; color: var(--cyan); font-weight: 800; }
.rows { flex: 1 1 0; max-width: 98rem; align-self: flex-start; }
.side { width: 42rem; flex: none; align-self: flex-start; }
.note { position: relative; font-size: 1.8rem; font-weight: 700; opacity: .78; letter-spacing: .03em; margin-top: 1.6rem; white-space: normal; line-height: 1.3; }
.pend { position: absolute; left: 6rem; right: 6rem; bottom: 9.6rem; height: 5.4rem; display: flex; align-items: center; justify-content: center; gap: 1.4rem; font-size: 2.05rem; letter-spacing: .04em; }
.pend > * { position: relative; } .pend .pl { position: absolute; left: 12%; right: 12%; border-color: var(--yellow); background: #2b2606; opacity: .9; border-radius: 1.2rem; }
.pend b { color: var(--yellow); font-weight: 900; }
.pend .ydot { width: 1.2rem; height: 1.2rem; background: var(--yellow); border-radius: .3rem; transform: skewX(-10deg) rotate(45deg); }

/* car cards */
.cars { flex: 1 1 0; display: flex; gap: 2.2rem; max-width: 150rem; flex-direction: column; }
.cardrow { display: flex; gap: 2.2rem; flex: 1 1 0; min-height: 0; }
.car { position: relative; flex: 1 1 0; min-width: 0; padding: 1.8rem 2.2rem 2rem 2.6rem; display: flex; flex-direction: column; }
.car > .pl { --skew: -3deg; border-radius: 2rem; opacity: .86; }
.car.sel { transform: translateY(-1.2rem); }
.car.sel > .pl { border: .45rem solid var(--cyan); background: #18303c; opacity: .97; box-shadow: 0 0 0 .5rem rgba(20,232,246,.25), 0 1.4rem 2.6rem rgba(4,12,18,.5); }
.car .art { position: relative; flex: 1 1 0; min-height: 0; border-radius: 1.2rem; overflow: hidden; }
.car .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.car .nm { position: relative; font-size: 3.1rem; font-weight: 900; margin-top: 1.4rem; display: flex; align-items: center; }
.car .ds { position: relative; font-size: 1.65rem; font-weight: 700; opacity: .78; margin-top: .7rem; letter-spacing: .04em; }
.stat { position: relative; display: flex; align-items: center; gap: 1rem; font-size: 1.55rem; letter-spacing: .1em; margin-top: .95rem; }
.stat span { width: 8.6rem; opacity: .75; }
.stat .bar { flex: 1; height: 1.1rem; border-radius: .35rem; background: rgba(255,255,255,.14); transform: skewX(-10deg); overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: #dfe7ec; border-radius: .3rem; }
.car.sel .stat .bar i { background: var(--cyan); }
.car > .tag { position: absolute; right: 1.6rem; top: 1.4rem; z-index: 1; margin: 0; font-size: 1.6rem; }
.car > .tag.cy { background: #0e161d; }
.livery { position: relative; height: 7.4rem; flex: none; display: flex; align-items: center; padding: 0 3rem 0 3.4rem; }
.livery .lbl { position: relative; font-size: 2.8rem; font-weight: 900; }
.sws { position: relative; display: flex; gap: 1.2rem; align-items: center; margin-left: auto; }
.swt { width: 6.4rem; height: 3.8rem; border-radius: .8rem; transform: skewX(-10deg); box-shadow: inset 0 0 0 .18rem rgba(255,255,255,.55); opacity: .9; }
.swt.on { box-shadow: 0 0 0 .3rem #fff, 0 0 0 .7rem rgba(255,255,255,.25); opacity: 1; }
.livery .lname { position: relative; font-size: 2.2rem; width: 20rem; text-align: right; }

/* controls sheet */
.ctl { display: grid; grid-template-columns: 1fr 1.25fr 1.25fr; position: relative; column-gap: 2rem; }
.ctl > div { height: 5.5rem; display: flex; align-items: center; gap: .8rem; font-size: 2.3rem; border-top: max(1px,.12rem) solid rgba(174,187,194,.28); }
.ctl > div.h { font-size: 1.7rem; letter-spacing: .22em; color: var(--cyan); border: 0; height: 3.6rem; }
.ctl > div.a { font-weight: 900; }
.ctl small { font-size: 1.6rem; opacity: .7; font-weight: 700; margin-left: .4rem; }

/* pause / confirm */
.center { position: absolute; inset: 0 0 6rem 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pausebox { width: 64rem; padding: 3rem 4rem 3.6rem 4.4rem; }
.pausebox h1 { position: relative; margin: 0; font-size: 6.6rem; font-weight: 900; letter-spacing: .03em; text-align: center; }
.pausebox .where { position: relative; text-align: center; font-size: 1.95rem; letter-spacing: .12em; opacity: .8; margin: .9rem 0 1.4rem; font-weight: 700; }
.pausebox .row { height: 6rem; margin-top: .85rem; }
.pausebox .row .lbl { font-size: 2.9rem; }
.dialog { width: 78rem; padding: 3.4rem 4.4rem 3.8rem; text-align: center; }
.dialog > .pl { border-color: var(--yellow); opacity: .95; }
.dialog h1 { position: relative; margin: 0; font-size: 4.6rem; font-weight: 900; }
.dialog p { position: relative; font-size: 2.3rem; font-weight: 700; opacity: .88; white-space: normal; line-height: 1.35; margin: 1.6rem 0 2.6rem; }
.btns { position: relative; display: flex; gap: 2rem; justify-content: center; }
.btn { position: relative; height: 7rem; min-width: 26rem; padding: 0 3rem; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; font-weight: 900; letter-spacing: .03em; }
.btn > span { position: relative; text-align: center; }
.btn.focus { color: var(--ink); text-shadow: 0 .06em 0 rgba(255,255,255,.45); }
.btn.focus > .pl { background: linear-gradient(180deg, #5ff3fb 0, var(--cyan) 55%, #0fcfdd 100%); border-color: #fff; opacity: 1; box-shadow: 0 0 0 .45rem rgba(20,232,246,.28), 0 .8rem 1.8rem rgba(4,12,18,.45); }
.btn .sub { display: block; font-size: 1.5rem; letter-spacing: .1em; font-weight: 700; opacity: .8; margin-top: .5rem; }

/* post-race: replica of Hud.ts' finish panel + the new action row */
.finish { position: relative; width: 46rem; padding: 2.6rem 4.2rem 2.8rem; text-align: center; }
.finish > .pl { --skew: -4deg; border-radius: 2.2rem; opacity: .93; }
.finish > div { position: relative; }
.f-title { font-size: 7rem; font-weight: 900; letter-spacing: .03em; }
.f-place { font-size: 3rem; margin-top: 1.35rem; color: var(--yellow); }
.f-total { font-size: 4.6rem; margin-top: 2.3rem; }
.f-total b, .f-row b { font-weight: inherit; opacity: .62; margin-right: .6em; letter-spacing: .04em; }
.f-laps { margin: 1.5rem auto 0; width: 30rem; border-top: max(1px,.14rem) solid rgba(174,187,194,.5); padding-top: 1.1rem; }
.f-row { font-size: 2.6rem; display: flex; justify-content: space-between; margin-top: .9rem; }
.f-row.best { color: var(--cyan); }
.f-rec { font-size: 2.3rem; margin-top: 2rem; color: var(--yellow); }
.actions { display: flex; gap: 1.8rem; margin-top: 2.6rem; }
.actions .btn { min-width: 27rem; height: 7.6rem; }

/* ── narrow / portrait windows: one column ── */
@media (max-aspect-ratio: 6/5) {
  .card, .side, .chip { display: none; }
  .word h1 { font-size: 8.4rem; }
  .menu { width: auto; right: 7rem; }
  .cardrow { flex-wrap: wrap; } .car { flex: 1 1 40%; }
  .stage { left: 3rem; right: 3rem; }
  .foot { left: 3rem; right: 3rem; } .help { display: none; } .prompts { margin: 0 auto; gap: 1.6rem; }
  .tabs { transform: scale(.72); }
  .actions { flex-wrap: wrap; justify-content: center; width: 60rem; } .actions .btn { min-width: 27rem; }
  .pausebox { width: 58rem; } .dialog { width: 58rem; }
  .pend { font-size: 1.5rem; left: 2rem; right: 2rem; } .pend .pl { left: 0; right: 0; }
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="scrim"></div>
<div class="ui" id="ui"></div>
<script>
const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'title';
const kb = q.get('prompts') === 'kb';

// ── DualShock glyphs (inline SVG) and their keyboard twins ──
const face = (sym) => `<span class="g"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#0f171f" stroke="#dfe7ec" stroke-width="2.4"/>${sym}</svg></span>`;
const dpad = (lr, ud) => `<span class="g"><svg viewBox="0 0 40 40"><path d="M15 3h10v12h12v10H25v12H15V25H3V15h12z" fill="#0f171f" stroke="#dfe7ec" stroke-width="2.4" stroke-linejoin="round"/>` +
  (ud ? `<path d="M20 6l4 6h-8zM20 34l4-6h-8z" fill="#14e8f6"/>` : '') + (lr ? `<path d="M6 20l6-4v8zM34 20l-6-4v8z" fill="#14e8f6"/>` : '') + `</svg></span>`;
const G = {
  cross: face('<path d="M13 13l14 14M27 13L13 27" stroke="#8fb8ff" stroke-width="3.4" stroke-linecap="round"/>'),
  circle: face('<circle cx="20" cy="20" r="8" fill="none" stroke="#ff7482" stroke-width="3.2"/>'),
  triangle: face('<path d="M20 11l9 15H11z" fill="none" stroke="#49e6b4" stroke-width="3.2" stroke-linejoin="round"/>'),
  square: face('<rect x="12.5" y="12.5" width="15" height="15" rx="1.5" fill="none" stroke="#f3a3dc" stroke-width="3.2"/>'),
  stick: face('<circle cx="20" cy="20" r="9" fill="#dfe7ec"/><text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="900" font-family="system-ui" fill="#0f171f">L</text>'),
  nav: dpad(false, true), lr: dpad(true, false), all: dpad(true, true),
  l1: '<span class="g pill">L1</span>', r1: '<span class="g pill">R1</span>', l2: '<span class="g pill">L2</span>', r2: '<span class="g pill">R2</span>',
  options: '<span class="g pill opt">OPTIONS</span>',
};
const key = (t) => `<span class="g key">${t}</span>`;

      : `<path d="M40 36L118 38 196 60 118 82 40 84z" fill="${c.body}" stroke-linejoin="round"/><path d="M128 46l44 14-44 14 16-14z" fill="${c.trim}"/><path d="M30 30l22 8-22 6zM30 90l22-8-22-6z" fill="${c.trim}"/><circle cx="36" cy="60" r="8" fill="#2a3440"/><circle cx="36" cy="60" r="4.5" fill="#39b8ff"/>`;
  return `<svg viewBox="0 0 150 200" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g${c.id}" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#33495a"/><stop offset="1" stop-color="#101a22"/></radialGradient></defs>
