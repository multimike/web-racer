<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Physics Lab (hybrid break tests) — web-racer</title>
<link rel="icon" href="data:," />
<style>
  html, body { height: 100%; margin: 0; background: #14181d; color: #d7dde4; }
  body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; }
  header { padding: 8px 12px; background: #1d232a; border-bottom: 1px solid #2c343d; }
  #status { color: #8cc7ff; }
  canvas { display: none; width: 100%; height: 55vh; background: #223; outline: none; }
  body.watch canvas { display: block; }
  pre { margin: 0; padding: 8px 12px; white-space: pre; overflow: auto; }
  #result { color: #6f7b88; font-size: 10px; }
</style>
</head>
<body>
<!--
  Break-test page for the 'hybrid' vehicle model: the standard physics lab
  (src/lab/physicsLab.ts, untouched) with the extra maneuvers of this folder
  appended to its suite. Same query parameters as /physics-lab.html
  (model, car, dt, tune, driver, watch, series); extra maneuver names:
    hxSaw, hxDonut, hxBrakeLock, hxReverse, hxAir, hxObstacle, hxSlope,
    hxWall, hxInverted, hxFrame, hxRespawn, hxGarbage, hxDebug,
    huReaction, huOvercorrect, huDrift
  Always pass &suite=... (suite=all would also run the 16 standard maneuvers).
  Headless: src/lab/physics/extra-hybrid/breaklab.sh "<query>" out.json [timeout]
-->
<header><b>Physics Lab — hybrid break tests</b> &nbsp; <span id="status">loading…</span></header>
<canvas id="lab"></canvas>
<pre id="scorecard"></pre>
<pre id="result"></pre>
<script type="module" src="./breakLab.ts"></script>
</body>
</html>
