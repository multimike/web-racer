<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terrain Lab — web-racer</title>
<link rel="icon" href="data:," />
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #9cc6e8; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #result { display: none; }
  #status {
    position: absolute; left: 10px; bottom: 8px; margin: 0; max-width: 70vw;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); pointer-events: none;
  }
  body.quiet #status { display: none; }
  body.failed #status { display: block; top: 8px; bottom: auto; right: 10px; max-width: none; background: rgba(120, 0, 0, 0.85); padding: 8px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="lab"></canvas>
<div id="status">loading…</div>
<pre id="result"></pre>
<script type="module" src="/src/lab/terrainLab.ts"></script>
</body>
